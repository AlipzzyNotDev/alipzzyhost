<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlipzzyHost - Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            max-width: 400px; margin: 100px auto; padding: 30px;
            background: rgba(0,0,0,0.8); border: 2px solid var(--neon-pink);
            border-radius: 15px; text-align: center;
        }
        h2 { color: var(--neon-pink); margin-bottom: 20px; }
        input { background: #222; color: white; border: 1px solid #444; margin-bottom: 15px; }
        .link-auth { display: block; margin-top: 15px; color: #aaa; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="auth-container">
            <h2>LOGIN</h2>
            <form id="loginForm">
                <input type="text" id="loginUser" placeholder="Username" required>
                <input type="password" id="loginPass" placeholder="Password" required>
                <button type="submit" class="btn-buy">MASUK</button>
            </form>
            <a href="register.html" class="link-auth">Belum punya akun? Daftar gratis</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;

            // Cek Khusus Admin (Sesuai permintaanmu)
            if (user === "AlipzzyOfficiaL" && pass === "AlipGanz1") {
                const adminData = { username: user, role: 'admin' };
                localStorage.setItem('currentUser', JSON.stringify(adminData));
                alert("Selamat Datang Owner Alip!");
                window.location.href = 'dashboard.html';
                return;
            }

            // Cek User Biasa
            const savedData = localStorage.getItem('user_' + user);
            if (savedData) {
                const parsedData = JSON.parse(savedData);
                if (parsedData.password === pass) {
                    localStorage.setItem('currentUser', JSON.stringify(parsedData));
                    alert("Login Berhasil!");
                    window.location.href = 'index.html';
                } else {
                    alert("Password Salah!");
                }
            } else {
                alert("Username tidak ditemukan!");
            }
        });
    </script>
</body>
</html>
