<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - AlipzzyHost</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="config.js"></script>
</head>
<body>
    <div class="overlay">
        <nav>
            <div class="logo"><img src="https://files.catbox.moe/vztxl0.png"></div>
            <a href="index.html" style="color:white; text-decoration:none;">Back to Home</a>
        </nav>

        <div id="userSection" style="display:none; padding: 30px;">
            <div class="card" style="max-width: 450px; margin: auto; background: white; color: black;">
                <h2 style="color:black">CHECKOUT</h2>
                <p id="itemDetail" style="font-weight:bold; margin: 10px 0;"></p>
                <img src="https://files.catbox.moe/t8p77l.jpeg" width="100%" style="border-radius:10px;">
                <div id="timer" style="font-size: 25px; color: red; font-weight: bold; margin: 15px 0;">10:00</div>
                <p style="font-size:12px;">Silakan upload bukti transfer:</p>
                <input type="file" id="buktiTf" style="color:black; background:#eee;">
                <button class="btn-buy" onclick="kirimOrder()">Selesai Bayar</button>
            </div>
        </div>

        <div id="adminSection" style="display:none; width: 90%; margin: auto; padding: 30px;">
            <h1 style="color:var(--neon)">ADMIN DASHBOARD</h1>
            <div id="adminStats" style="display:flex; gap:15px; margin: 20px 0;">
                <div class="card" style="flex:1;">TRX Hari Ini: <br><span id="todayTrx">0</span></div>
                <div class="card" style="flex:1;">TRX Bulan Ini: <br><span id="monthTrx">0</span></div>
            </div>
            
            <button class="btn-buy" onclick="sendAnnouncement()" style="margin-bottom:10px;">KIRIM POP-UP GLOBAL</button>
            <button class="btn-buy" onclick="sendPrivateMsg()" style="background:blue;">PESAN INDIVIDU</button>

            <h3>Pesanan Masuk</h3>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr><th>User</th><th>Item</th><th>Harga</th><th>Status</th><th>Aksi</th></tr>
                    </thead>
                    <tbody id="orderList">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('currentUser'));
        const params = new URLSearchParams(window.location.search);

        if (user && user.username === "AlipzzyOfficiaL") {
            document.getElementById('adminSection').style.display = 'block';
            loadOrders();
        } else if (params.get('action') === 'payment') {
            document.getElementById('userSection').style.display = 'block';
            document.getElementById('itemDetail').innerText = `${params.get('item')} - Rp${params.get('price')}`;
            startTimer();
        }

        function startTimer() {
            let time = 600;
            const timerDiv = document.getElementById('timer');
            const countdown = setInterval(() => {
                let m = Math.floor(time / 60);
                let s = time % 60;
                timerDiv.innerHTML = `${m}:${s < 10 ? '0'+s : s}`;
                if (time-- <= 0) clearInterval(countdown);
            }, 1000);
        }

        function kirimOrder() {
            const item = params.get('item');
            const price = params.get('price');
            db.ref('orders').push({
                username: user.username,
                item: item,
                price: price,
                status: 'Proses',
                timestamp: Date.now()
            });
            alert("Pembayaran Terkirim! Mohon tunggu konfirmasi admin 1-10 menit.");
            window.location.href = 'index.html';
        }

        function loadOrders() {
            db.ref('orders').on('value', (snap) => {
                const list = document.getElementById('orderList');
                list.innerHTML = "";
                snap.forEach(child => {
                    const data = child.val();
                    list.innerHTML += `
                        <tr>
                            <td>${data.username}</td>
                            <td>${data.item}</td>
                            <td>${data.price}</td>
                            <td>${data.status}</td>
                            <td>
                                <button onclick="updateStatus('${child.key}', 'Selesai')">Selesai</button>
                                <button onclick="updateStatus('${child.key}', 'Refund')">Refund</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        function updateStatus(id, status) {
            db.ref('orders/' + id).update({ status: status });
        }

        function sendAnnouncement() {
            const msg = prompt("Isi Pop-up Global:");
            if (msg) db.ref('announcements/global').set({ text: msg, active: true });
        }
    </script>
</body>
</html>
